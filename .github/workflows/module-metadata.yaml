name: Add module metadata

env:
  COMPOSE_USER: runner

on:
  push:
    tags:
      - "*.*.*"

jobs:
  add-metadata:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # https://github.com/stefanzweifel/git-auto-commit-action#usage
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true

      - run: |
          git log
          git status

      - name: Add module metadata
        run: |
          # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/contexts#github-context
          tag_name="${{ github.ref_name }}"
          sed --expression 's/^version:.*/version: "'"$tag_name"'"/' --expression "s/^datestamp: .*/datestamp: $(date +%s)/" --in-place drupal_translation_extractor.info.yml

      # # https://github.com/mxschmitt/action-tmate?tab=readme-ov-file#manually-triggered-debug
      # # Enable tmate debugging if debug logging is enabled (cf.
      # # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#runner-context)
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     limit-access-to-actor: false
      #   if: 1 == runner.debug

      - uses: stefanzweifel/git-auto-commit-action@v7

      - name: Update tag
        run: |
          git tag --force "$tag_name"
